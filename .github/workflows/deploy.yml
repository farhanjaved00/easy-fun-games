name: Deploy

# Builds, checks and deploys to Cloudflare Pages.
# If any check fails, nothing is deployed and the current live site stays up.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # every day at 03:17 UTC
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Allow the game count to drop more than 5%"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check
        env:
          CHECK_LIVE: "1"
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '0' }}

      - name: Create the Pages project (first run only)
        run: npx --yes wrangler@4 pages project create easy-fun-games --production-branch=main || echo "Project already exists, continuing."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=easy-fun-games --branch=main --commit-dirty=true

      - name: Ping IndexNow
        if: success()
        continue-on-error: true
        run: npm run indexnow
