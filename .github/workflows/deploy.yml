name: Deploy

# Daily (and on demand): imports new games from onlinegames.io with AI-written pages.
# Then, and on every push to main: builds, checks and deploys to Cloudflare Pages.
# If any check fails, nothing is deployed and the current live site stays up.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # every day at 03:17 UTC
  workflow_dispatch:
    inputs:
      import_count:
        description: "How many new games to import (0 = none)"
        type: number
        default: 5
      allow_shrink:
        description: "Allow the game count to drop more than 5%"
        type: boolean
        default: false

permissions:
  contents: write # lets the daily import save new games to the repo
  issues: write # keeps the "Games needing review" issue up to date

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install packages
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[import]')
        run: npm ci

      # Tests every game and lists problems in REVIEW.md. Report only: no page is changed.
      - name: Check game health
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/health-check.mjs

      # Runs daily, on manual runs, and on pushes whose commit message contains [import].
      - name: Import new games
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[import]')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/import-onlinegames.mjs --count ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.import_count) || '5' }}

      - name: Save game changes to the repo
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[import]')
        run: |
          git add data src/static/thumbs REVIEW.md
          if git diff --cached --quiet; then echo "No new games."; exit 0; fi
          git config user.name "EasyGameFun bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily games update $(date -u +%F)"
          git push

      - name: Update the "Games needing review" issue
        if: github.event_name != 'push' && hashFiles('REVIEW.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(grep -c '^| .*(`' REVIEW.md || true)
          today=$(date -u +%F)
          num=$(gh issue list --state open --search 'Games needing review in:title' --json number --jq '.[0].number // empty')
          if [ "$count" -gt 0 ]; then
            if [ -z "$num" ]; then
              gh issue create --title "Games needing review" --body-file REVIEW.md
            else
              gh issue edit "$num" --body-file REVIEW.md
              if grep -q "| $today |" REVIEW.md; then gh issue comment "$num" --body "New problem(s) found today ($today). See the list above."; fi
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "All games loaded fine on the latest check."
          fi

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check
        env:
          CHECK_LIVE: "1"
          ALLOW_SHRINK: ${{ (inputs.allow_shrink || contains(github.event.head_commit.message, '[allow-shrink]')) && '1' || '0' }}

      - name: Create the Pages project (first run only)
        run: npx --yes wrangler@4 pages project create easy-fun-games --production-branch=main || echo "Project already exists, continuing."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=easy-fun-games --branch=main --commit-dirty=true

      - name: Ping IndexNow
        if: success()
        continue-on-error: true
        run: npm run indexnow
