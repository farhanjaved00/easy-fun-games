name: Deploy

# Daily (and on demand): imports new games from onlinegames.io with AI-written pages.
# Then, and on every push to main: builds, checks and deploys to Cloudflare Pages.
# If any check fails, nothing is deployed and the current live site stays up.
on:
  push:
    branches: [main]
  # The main daily start comes from the Cloudflare timer (cron/worker.js, 03:20 and 13:20 UTC).
  # This GitHub schedule is only a backup. Every run adds just the games still missing for the day.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      import_count:
        description: "How many new games to import (0 = none)"
        type: number
        default: 5
      daily:
        description: "Daily mode: only add the games still missing today"
        type: boolean
        default: false
      allow_shrink:
        description: "Allow the game count to drop more than 5%"
        type: boolean
        default: false

permissions:
  contents: write # lets the daily import save new games to the repo
  issues: write # keeps the "Games needing review" issue up to date

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install packages
        if: github.event_name != 'push' || contains(toJson(github.event.commits), '[import]') || contains(toJson(github.event.commits), '[covers]')
        run: npm ci

      # Tests every game and lists problems in REVIEW.md. Report only: no page is changed.
      - name: Check game health
        if: github.event_name != 'push' || contains(toJson(github.event.commits), '[import]')
        continue-on-error: true
        run: node scripts/health-check.mjs

      # Runs daily, on manual runs, and on pushes whose commit message contains [import].
      - name: Import new games
        if: github.event_name != 'push' || contains(toJson(github.event.commits), '[import]')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          COUNT="${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.import_count) || '' }}"
          if [ -z "$COUNT" ]; then
            MSG="${{ toJson(github.event.commits) }}"
            MATCH=$(echo "$MSG" | grep -oE '\[import:([0-9]+)\]' | grep -oE '[0-9]+' | head -n 1 || true)
            COUNT="${MATCH:-5}"
          fi
          node scripts/import-onlinegames.mjs --count "$COUNT" ${{ (github.event_name == 'schedule' || inputs.daily) && '--daily' || '' }}

      # Replaces partner thumbnails with original AI covers, a few games per run.
      - name: Make AI covers
        if: github.event_name != 'push' || contains(toJson(github.event.commits), '[import]') || contains(toJson(github.event.commits), '[covers]')
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/make-covers.mjs --limit 15

      # Branded images for the next games to post; they go live with this deploy.
      - name: Prepare social images
        if: github.event_name != 'push' || contains(toJson(github.event.commits), '[import]')
        continue-on-error: true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_LOGIN_TOKEN: ${{ secrets.IG_LOGIN_TOKEN }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: node scripts/social-post.mjs prepare

      - name: Save game changes to the repo
        id: save
        if: github.event_name != 'push' || contains(toJson(github.event.commits), '[import]') || contains(toJson(github.event.commits), '[covers]')
        run: |
          git add data src/static/thumbs src/static/social REVIEW.md
          if git diff --cached --quiet; then echo "Nothing changed, so there is nothing to publish."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "EasyGameFun bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily games update $(date -u +%F)"
          git push

      - name: Update the "Games needing review" issue
        if: github.event_name != 'push' && hashFiles('REVIEW.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(grep -c '^| .*(`' REVIEW.md || true)
          today=$(date -u +%F)
          num=$(gh issue list --state open --search 'Games needing review in:title' --json number --jq '.[0].number // empty')
          if [ "$count" -gt 0 ]; then
            if [ -z "$num" ]; then
              gh issue create --title "Games needing review" --body-file REVIEW.md
            else
              gh issue edit "$num" --body-file REVIEW.md
              if grep -q "| $today |" REVIEW.md; then gh issue comment "$num" --body "New problem(s) found today ($today). See the list above."; fi
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "All games loaded fine on the latest check."
          fi

      - name: Build
        if: github.event_name == 'push' || steps.save.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && !inputs.daily)
        run: npm run build

      - name: Check
        if: github.event_name == 'push' || steps.save.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && !inputs.daily)
        run: npm run check
        env:
          CHECK_LIVE: "1"
          ALLOW_SHRINK: ${{ (inputs.allow_shrink || contains(github.event.head_commit.message, '[allow-shrink]')) && '1' || '0' }}

      - name: Create the Pages project (first run only)
        if: github.event_name == 'push' || steps.save.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && !inputs.daily)
        run: npx --yes wrangler@4 pages project create easy-fun-games --production-branch=main || echo "Project already exists, continuing."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' || steps.save.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && !inputs.daily)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=easy-fun-games --branch=main --commit-dirty=true

      - name: Ping IndexNow
        if: success() && (github.event_name == 'push' || steps.save.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && !inputs.daily))
        continue-on-error: true
        run: npm run indexnow

      # Posts games whose images are live; nothing is posted twice (data/social.json).
      - name: Post to social media
        id: social
        if: github.event_name != 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_LOGIN_TOKEN: ${{ secrets.IG_LOGIN_TOKEN }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: node scripts/social-post.mjs post

      - name: Save social media log
        if: always() && github.event_name != 'push'
        run: |
          git add data/social.json data/sources 2>/dev/null || true
          if git diff --cached --quiet; then echo "No social changes."; exit 0; fi
          git config user.name "EasyGameFun bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Social posts $(date -u +%F)"
          git pull --rebase --autostash -q && git push
