name: CI

# Builds the site and runs every check on pull requests and pushes to branches other than main.
# (Pushes to main are checked by the deploy workflow.)
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build
        run: npm run build
      - name: Check
        run: npm run check
